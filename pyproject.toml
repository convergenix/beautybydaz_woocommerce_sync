[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beautybydaz-woocommerce-sync"
version = "1.0.0"
description = "Audited ERPNext v15 and WooCommerce integration for Beauty By Daz"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Convergenix"}]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["beautybydaz_woocommerce_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
